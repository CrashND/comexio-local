refresh_discovery:
  name: Anschluesse neu erkennen
  description: COMEXIO-Konfiguration neu einlesen. Fuehrt nur GET-Abfragen aus.
  fields:
    entry_id:
      name: Entry-ID
      description: Optional, bei mehreren IO-Servern erforderlich.
      example: 01J... 
snapshot_once:
  name: Status einmalig lesen
  description: Einmaliger TCP-GET der erkannten Zustaende.
  fields:
    entry_id:
      name: Entry-ID
      description: Optional.
configure_push:
  name: COMEXIO Push Web-IO einrichten
  description: >
    ACHTUNG! Schreibt neue, eigene Web-IO-Kommandos und Logikplaene in COMEXIO.
    Nur nach vollstaendigem Backup und ausdruecklicher Freigabe verwenden.
  fields:
    entry_id:
      name: Entry-ID
      description: Optional bei einem IO-Server.
    confirm:
      name: Backup und Aenderung bestaetigt
      description: Muss true sein, sonst wird nichts veraendert.
      required: true
      example: true
      selector:
        boolean:

push_diagnose:
  name: COMEXIO Push Diagnose (nur lesen)
  description: >
    Prueft vorhandene Web-IO-Kommandos, Ziele und Verbindungen der
    COMEXIO-Local-eigenen Logikplaene. Aendert nichts an COMEXIO.
  fields:
    entry_id:
      name: Entry-ID
      description: Optional bei einem IO-Server.

get_push_events:
  name: COMEXIO Push Ereignisse anzeigen
  description: >
    Zeigt die letzten akzeptierten Webhook-Meldungen und eine Statistik pro
    Quelladresse an. Rein lesend; keine COMEXIO-Abfragen oder Schreibzugriffe.
    Das Protokoll beginnt nach jedem Neustart der Integration erneut.
  fields:
    entry_id:
      name: Entry-ID
      description: Optional bei nur einem IO-Server.
    limit:
      name: Anzahl Ereignisse
      description: Bis zu 80 letzte Ereignisse, Standard 30.
      default: 30
      example: 30
      selector:
        number:
          min: 1
          max: 80
          mode: box
