refresh_discovery:
  name: Anschluesse neu erkennen
  description: COMEXIO-Konfiguration neu einlesen. Fuehrt nur GET-Abfragen aus.
  fields:
    entry_id:
      name: Entry-ID
      description: Optional, bei mehreren IO-Servern erforderlich.
      example: 01J... 
snapshot_once:
  name: Status einmalig lesen
  description: Einmaliger TCP-GET der erkannten Zustaende.
  fields:
    entry_id:
      name: Entry-ID
      description: Optional.
configure_push:
  name: COMEXIO Push Web-IO einrichten
  description: >
    ACHTUNG! Schreibt neue, eigene Web-IO-Kommandos und Logikplaene in COMEXIO.
    Nur nach vollstaendigem Backup und ausdruecklicher Freigabe verwenden.
  fields:
    entry_id:
      name: Entry-ID
      description: Optional bei einem IO-Server.
    confirm:
      name: Backup und Aenderung bestaetigt
      description: Muss true sein, sonst wird nichts veraendert.
      required: true
      example: true
      selector:
        boolean:

push_diagnose:
  name: COMEXIO Push Diagnose (nur lesen)
  description: >
    Prueft vorhandene Web-IO-Kommandos, Ziele und Verbindungen der
    COMEXIO-Local-eigenen Logikplaene. Aendert nichts an COMEXIO.
  fields:
    entry_id:
      name: Entry-ID
      description: Optional bei einem IO-Server.

get_push_events:
  name: COMEXIO Push Ereignisse anzeigen
  description: >
    Zeigt die letzten akzeptierten Webhook-Meldungen und eine Statistik pro
    Quelladresse an. Rein lesend; keine COMEXIO-Abfragen oder Schreibzugriffe.
    Das Protokoll beginnt nach jedem Neustart der Integration erneut.
  fields:
    entry_id:
      name: Entry-ID
      description: Optional bei nur einem IO-Server.
    limit:
      name: Anzahl Ereignisse
      description: Bis zu 80 letzte Ereignisse, Standard 30.
      default: 30
      example: 30
      selector:
        number:
          min: 1
          max: 80
          mode: box

preview_push_repair:
  name: COMEXIO Push-Reparaturvorschau (nur lesen)
  description: >
    Prüft ausgewählte Licht- oder Rollladen-Quellen und zeigt die geplante
    Reparatur mit einem Prüffingerabdruck. Verändert COMEXIO nicht.
  fields:
    entry_id:
      name: Entry-ID
      description: Bei mehreren IO-Servern erforderlich.
    sources:
      name: Quellschlüssel
      description: 'Beispiel: ["io:IO-Ext-2/Q2", "cover:M85"]'
      required: true
      example: ['io:IO-Ext-2/Q2']
      selector:
        object:
    mode:
      name: Verfahren
      description: 'repair = Fehlendes ergänzen; rebuild = Neuaufbau prüfen (bestehende Objekte nur geführt manuell entfernen).'
      default: repair
      selector:
        select:
          options:
            - repair
            - rebuild

repair_push:
  name: COMEXIO Push-Verbindungen gezielt reparieren
  description: >
    ADMINAKTION: Ausschließlich fehlende COMEXIO-Local-Push-Ressourcen schreiben.
    Eine unveränderte Reparaturvorschau und aktuelle COMEXIO-Sicherung sind Pflicht.
    Bereits existierende Web-IO-Kommandos werden nicht gelöscht oder überschrieben.
  fields:
    entry_id:
      name: Entry-ID
      description: Bei mehreren IO-Servern erforderlich.
    sources:
      name: Quellen
      description: Dieselbe Quellenauswahl wie in der Vorschau.
      required: true
      example: ['io:IO-Ext-2/Q2']
      selector:
        object:
    fingerprint:
      name: Prüffingerabdruck
      description: Exakt den fingerprint aus preview_push_repair übernehmen.
      required: true
      selector:
        text:
    mode:
      name: Verfahren
      description: Muss zur Vorschau passen.
      default: repair
      selector:
        select:
          options:
            - repair
            - rebuild
    confirm:
      name: Sicherung und Änderungen bestätigt
      description: Muss true sein.
      required: true
      selector:
        boolean:

preview_push_rebuild:
  name: Vollständigen Push-Neuaufbau prüfen
  description: Prüft lesend die eigene COMEXIO-Local-Web-IO-Klasse und CL-Push-Pläne. Zeigt einen Fingerabdruck.
  fields:
    entry_id:
      name: Entry-ID
      description: Optional bei nur einem IO-Server.
start_push_rebuild:
  name: Vollständigen Push-Neuaufbau vorbereiten
  description: >
    ADMINAKTION. Erfordert eine vollständige Sicherung und die unveränderte Vorschau.
    Vorhandene eindeutig eigene CL-Push-Ressourcen werden nur bei zusätzlicher
    ausdrücklicher Löschbestätigung zuerst als eigene Logikpläne und danach als
    exklusives Web-IO-Gerät entfernt und jeder Schritt rückgelesen. Referenzen
    aus fremden Plänen oder unklare Eigentumsdaten blockieren das Löschen.
    Anschließend wird mit mindestens 2 s Schreibabstand neu aufgebaut.
  fields:
    entry_id:
      name: Entry-ID
      description: Optional.
    fingerprint:
      name: Vorschau-Fingerabdruck
      required: true
      selector:
        text:
    confirm:
      name: Sicherung und Neuaufbau ausdrücklich bestätigt
      required: true
      selector:
        boolean:
    cleanup_confirmed:
      name: Eigene Push-Pläne und Web-IO-Gerät ausdrücklich löschen
      description: Nur erforderlich, wenn die Vorschau eigene Ressourcen zur Löschung zeigt.
      selector:
        boolean:
get_push_rebuild_status:
  name: Fortschritt des Push-Neuaufbaus
  description: Status, aktueller Schritt, Prozent, Zeit, Pause und Fehler nur lesen.
  fields:
    entry_id:
      name: Entry-ID
      description: Optional.
control_push_rebuild:
  name: Push-Neuaufbau steuern
  description: >
    ADMINAKTION. Pausieren, fortsetzen oder abbrechen. Fortsetzung prüft den
    COMEXIO-Zustand gegen den dauerhaft gespeicherten Checkpoint.
  fields:
    entry_id:
      name: Entry-ID
      description: Optional.
    operation:
      name: Aktion
      required: true
      selector:
        select:
          options:
            - pause
            - resume
            - cancel
